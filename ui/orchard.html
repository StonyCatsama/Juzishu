<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>橘子树</title>
<style>
  :root{
    --desk:#74543B;
    --folder:#3f5c86; --folder2:#4a6a99; --folderdk:#2e4568;
    --paper:#e3d9c2; --paper2:#ece3cd; --paper3:#d8ceb6;
    --ink:#2b2620; --ink2:#5c5346; --faded:#8a7f6c;
    --blue:#3c4d63; --red:#a8443c; --green:#4a6a52; --yellow:#e0c552;
    --line:#bfb49a; --line2:#a99d84;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--desk);min-height:100vh}
  .stage{position:relative;padding:14px 12px 18px;background:var(--desk);height:100vh;overflow:hidden;display:flex;flex-direction:column}
  /* 桌面：几道直线断纹。压在最底层，不压任何东西 */
  .deskgrain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .stack{position:relative;z-index:1;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  /* 壳 */
  .shell{position:relative}
  .shellart{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  /* 纸：单独一层，不透明，内容长在这层里 */
  .paperWrap{position:absolute;z-index:4;overflow:hidden;background-color:#E8DDC6;box-shadow:0 1px 2px rgba(96,78,48,.18);clip-path:polygon(0 0.6%,53% 0,100% 0.6%,100% 48%,100% 99.4%,45% 100%,0 99.4%)}
  .paperWrap::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:url("assets/mottle.png");background-size:340px 340px;mix-blend-mode:soft-light;opacity:.38;z-index:0}
  /* 标签：分两层夹着纸 */
  .tabsnav{position:absolute;inset:0;pointer-events:none;z-index:5}
  .tabsnav.front{z-index:7}
  /* 纸后那四张：左边 41% 压在纸上，裁掉，看着是从纸底下钻出来的 */
  .tabsnav .tn{clip-path:inset(0 0 0 40.7%)}
  .tabsnav.front .tn{clip-path:none}
  .tabsnav .tn{position:absolute;pointer-events:auto;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:13px;font-weight:700;letter-spacing:2px;line-height:1;color:#3d3312;border-radius:3px;background:linear-gradient(100deg,rgba(245,214,74,.10),rgba(245,214,74,.42) 42%,rgba(239,208,94,.80) 72%,rgba(233,198,79,.90));-webkit-backdrop-filter:blur(2.5px) saturate(.95);backdrop-filter:blur(2.5px) saturate(.95);border:1px solid rgba(217,174,36,.45);box-shadow:1px 2px 3px rgba(58,44,8,.38);transition:transform .18s ease}
  .tabsnav .tn.reveal{animation:tnIn .24s ease-out}
  .tabsnav .tn.retract{animation:tnOut .18s ease-in}
  @keyframes tnIn{from{transform:translateY(-26px);opacity:.15}to{transform:none;opacity:1}}
  @keyframes tnOut{from{transform:none;opacity:1}to{transform:translateY(-16px);opacity:.15}}
  /* ── 角色：卡片盒 ── */
  .role-bar{display:flex;gap:6px;align-items:center;margin-bottom:10px}
  .role-btn{font:inherit;font-size:11px;padding:5px 10px;border:1px solid var(--line2);background:var(--paper2);color:var(--ink);border-radius:3px;cursor:pointer;letter-spacing:.06em}
  .role-btn:hover{background:#fff8e8}
  .role-btn:active{transform:translateY(1px)}
  .role-list{display:flex;flex-wrap:wrap;gap:8px}
  .role-card{width:calc(50% - 4px);background:var(--paper2);border:1px solid var(--line2);border-left:3px solid #8fae8b;padding:8px 10px;cursor:pointer;box-shadow:1px 2px 0 rgba(0,0,0,.12);border-radius:2px}
  .role-card:hover{background:#fff8e8}
  .role-card.on{outline:2px solid #8fae8b;outline-offset:-1px}
  .rc-name{font-weight:700;font-size:13px;letter-spacing:.05em}
  .rc-meta{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--faded);margin-top:3px}
  .rc-tag{display:inline-block;font-size:9px;color:#4a6a52;border:1px solid #8fae8b;border-radius:2px;padding:0 3px;margin-top:4px}
  .role-panel{margin-top:12px;border-top:1px dashed var(--line2);padding-top:10px}
  .role-panel:empty{display:none}
  .role-form{display:flex;flex-direction:column;gap:6px}
  .role-form label{font-size:10px;color:var(--ink2);letter-spacing:.06em}
  .role-form input,.role-form textarea{font:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--line2);background:#fbf5e6;color:var(--ink);border-radius:3px}
  .role-form textarea{min-height:110px;resize:vertical;font-family:ui-monospace,monospace;font-size:10.5px}
  .role-actions{display:flex;gap:6px;margin-top:4px}
  .gear{margin-left:auto;align-self:flex-start;font:inherit;font-size:13px;line-height:1;padding:4px 7px;border:1px solid var(--line2);background:transparent;color:var(--ink2);border-radius:3px;cursor:pointer}
  .gear:hover{background:var(--paper2)}
  .cfg-wrap{background:var(--paper2);border:1px solid var(--line2);padding:12px;margin-bottom:12px;border-radius:4px}
  .cfg-title{font-size:11px;font-weight:700;letter-spacing:.1em;margin-bottom:8px}
  .cfg-row{display:grid;grid-template-columns:64px 1fr 1fr 1fr;gap:6px;margin-bottom:6px;align-items:center}
  .cfg-row input{font:inherit;font-size:11px;padding:4px 6px;border:1px solid var(--line2);background:#fbf5e6;width:100%;border-radius:2px}
  .cfg-row select{font:inherit;font-size:10.5px;padding:4px 4px;border:1px solid var(--line2);background:#fbf5e6;width:100%;border-radius:2px;color:var(--ink)}
  .cfg-lbl{font-family:ui-monospace,monospace;font-size:9px;color:var(--faded)}
  .cfg-actions{display:flex;gap:6px;margin-top:8px}
  .cfg-hint{font-size:11px;color:var(--faded);padding:8px 2px}
  .role-hint{font-size:11px;color:var(--faded);padding:6px 2px}
  .add-card{min-height:224px;border-radius:6px;border:2px dashed rgba(110,95,60,.32);background:transparent;box-shadow:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:.9;transition:opacity .15s,border-color .15s,background .15s}
  .add-card:hover{opacity:1;border-color:rgba(110,95,60,.58);background:rgba(233,224,201,.28)}
  .add-plus{font-size:32px;line-height:1;color:rgba(90,78,50,.5);font-weight:300}
  .add-text{font-size:10.5px;color:rgba(90,78,50,.5);letter-spacing:.2em}
  .idc-del{position:absolute;right:8px;top:8px;z-index:6;width:18px;height:18px;line-height:16px;text-align:center;border-radius:50%;background:rgba(0,0,0,.28);color:#fff;font-size:13px;cursor:pointer;opacity:.65;transition:opacity .15s,background .15s}
  .idc-del:hover{opacity:1;background:#a8443c}
  .idc-del.armed{width:auto;min-width:18px;padding:0 6px;border-radius:9px;background:#a8443c;opacity:1;font-size:10px;letter-spacing:.05em}
  .add-panel-wrap{grid-column:1/-1}
  .add-panel-wrap:empty{display:none}
  .add-panel-wrap .role-form{background:var(--paper);border-radius:6px;padding:12px 14px;color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .add-panel-wrap label{color:var(--ink2)}
  .add-panel-wrap input,.add-panel-wrap textarea{background:#fbf5e6;border:1px solid var(--line2);color:var(--ink)}
  .add-panel-wrap input::placeholder,.add-panel-wrap textarea::placeholder{color:var(--faded)}
  .add-panel-wrap .role-btn{background:var(--paper2);border:1px solid var(--line2);color:var(--ink)}
  .add-panel-wrap .role-btn:hover{background:#fff8e8}
  .add-panel-wrap .role-bar{margin-bottom:8px}
  .role-persona{white-space:pre-wrap;font-size:11.5px;line-height:1.7;color:var(--ink2);background:#fbf5e6;border:1px solid var(--line);padding:8px 10px;max-height:240px;overflow:auto;margin-top:6px}
  .role-seg{margin-top:8px}
  .role-seg-t{font-family:ui-monospace,monospace;font-size:9px;color:var(--faded);letter-spacing:.14em;margin-bottom:3px}
  .tabsnav .tn.t-cur{box-shadow:2px 3px 6px rgba(58,44,8,.42)}
  /* 本子：长在纸里 */
  .book{position:absolute;background:transparent;overflow:hidden;display:flex;flex-direction:column;z-index:4}
  .book::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:url("assets/grain.png");background-size:112px 112px;mix-blend-mode:multiply;opacity:.12;z-index:3}
  /* 螺旋与夹子：压在纸上 */
  .shellover{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;display:block}
  /* 蓝皮单独一层：压住抽屉里的纸和卡，被本子压住 */
  .folderover{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;display:block}
  /* 笔：躺在纸上，压在纸上面、页签下面 */
  .shellpencil{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;display:block}
  /* 邮戳：整张铺开，压住本子和抽屉，页签仍在它上面 */
  .maplayer{position:absolute;inset:0 40px 0 0;z-index:7;opacity:0;pointer-events:none;transition:opacity .28s ease;overflow:hidden}
  .maplayer.on{opacity:1;pointer-events:auto}
  /* 邮戳那一页搬进来之后，地图铺满这一块 */
  .maplayer #view-loc{position:absolute;inset:0;padding:0;overflow:hidden}
  .maplayer #view-loc .locwrap{height:100%;min-height:0}
  .maplayer #view-loc .mapbox{height:100%;border:none}
  .maplayer #view-loc .mapimg{width:100%;height:100%;object-fit:fill}
  /* 楼层图：按这块的高度贴，宽度自己算，不许按宽度撑满 */
  .maplayer #view-loc .floorbox.show{display:block;position:absolute;inset:0}
  .maplayer #view-loc .floorbox.show .ptabs{position:absolute;right:0;top:0;z-index:6}
  .maplayer #view-loc .floorbox.show .fhint{position:absolute;left:0;bottom:2px;margin:0;z-index:6}
  .maplayer #view-loc .fimgwrap{position:absolute;inset:34px 0 22px 0}
  .maplayer #view-loc .fimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .maplayer #view-loc .mapcap{left:10px;bottom:8px}
  .maplayer .miss{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-family:ui-monospace,monospace;font-size:11px;color:#6a5f48;letter-spacing:.08em;background:rgba(232,221,198,.9);padding:6px 12px}
  .mapfold{position:absolute;right:18px;bottom:18px;width:96px;height:38px;display:flex;align-items:center;justify-content:center;z-index:40;
    font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.14em;color:#efe4cc;background:#413628;
    box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer;pointer-events:auto;clip-path:polygon(0 0,100% 0,100% 100%,14% 100%)}
  .mapfold:hover{background:#4e402c}
  .shell.onmap .tabsnav{display:none}
  /* 版本角标：用来确认屏幕上跑的是哪一版 */
  .wrap{padding:15px 62px 22px 28px;position:relative;z-index:5;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
  #view-book{display:flex;flex-direction:column;flex:1;min-height:0}
  #wbPane{display:flex;flex-direction:column;flex:1;min-height:0}
  #rulesPane{display:flex;flex-direction:column;flex:1;min-height:0}
  #rulesPane .tree{box-shadow:none;border:none;background:transparent}
  /* 页眉 */
  .hdr{display:flex;align-items:flex-end;gap:11px;border-bottom:2.5px solid var(--ink);padding-bottom:7px;margin-bottom:4px}
  .hdr .code{font-family:ui-monospace,"Consolas",monospace;font-size:10px;color:var(--faded);letter-spacing:.05em}
  .hdr h1{font-family:Georgia,"Songti SC",serif;font-size:20px;font-weight:800;letter-spacing:.1em;color:var(--ink)}
  .hdr .stampbox{margin-left:auto;flex:none;transform:rotate(11deg);transform-origin:center;opacity:.86}
  .hdr .stamp{border:2.5px solid var(--red);border-radius:2px;padding:6px 10px;color:var(--red);text-align:center;font-family:"Georgia","Songti SC",serif;font-weight:800;line-height:1.25;box-shadow:inset 0 0 0 1.5px var(--red),inset 0 0 0 6.5px var(--red);position:relative}
  .hdr .stamp::before{content:"";position:absolute;inset:3px;border:1px solid var(--red);border-radius:1px;opacity:.55}
  .hdr .s1{font-size:12px;letter-spacing:.08em}
  .hdr .s2{font-size:10.5px;letter-spacing:.04em;font-style:italic}
  .subline{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--faded);letter-spacing:.06em;margin-bottom:10px;border-bottom:1px dashed var(--line2);padding-bottom:6px;display:flex;gap:14px;flex-wrap:wrap}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4f7a63;margin-right:4px}
  .dot.off{background:#b06a6a}
  /* 统计：一条细条 */
  .statbar{display:flex;align-items:center;gap:13px;font-family:ui-monospace,monospace;font-size:9.5px;color:var(--ink2);letter-spacing:.05em;border-bottom:1px dashed var(--line2);padding:0 2px 5px;margin-bottom:8px}
  .statbar b{color:var(--ink);font-weight:700}
  .statbar .blk b{color:var(--red)}
  /* 工具行 */
  .toolbar{display:flex;gap:6px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
  .search{flex:1;min-width:110px;display:flex;align-items:center;gap:6px;background:var(--paper2);border:1px solid var(--line2);padding:5px 8px}
  .search input{border:0;outline:0;background:transparent;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--ink);width:100%}
  .fbtn{font:inherit;font-family:ui-monospace,monospace;font-size:10.5px;padding:5px 9px;border:1px solid var(--line2);background:var(--paper2);color:var(--ink2);cursor:pointer;letter-spacing:.03em;box-shadow:1px 1px 0 rgba(0,0,0,.12)}
  .fbtn.on{background:var(--blue);color:var(--paper2);border-color:var(--blue)}
  .fbtn.warn{color:#fff;background:var(--red);border-color:var(--red)}
  /* 筛选（可折叠） */
  .fbar{background:var(--paper2);border:1px dashed var(--line2);margin-bottom:9px}
  .fbar-head{display:flex;align-items:center;gap:8px;padding:6px 9px;cursor:pointer;user-select:none;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ink2);letter-spacing:.05em}
  .fbar-head .summary{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .fbar-body{display:none;padding:4px 9px 9px;border-top:1px dashed var(--line2);gap:7px;flex-direction:column}
  .fbar.open .fbar-body{display:flex}
  .frow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .frow .lab{color:var(--faded);font-family:ui-monospace,monospace;font-size:9.5px;width:26px;flex:none}
  .pill{font-family:ui-monospace,monospace;font-size:10px;padding:2px 9px;border:1px solid var(--line2);background:var(--paper2);color:var(--ink2);cursor:pointer;user-select:none}
  .pill.on{background:var(--blue);color:var(--paper2);border-color:var(--blue)}
  .pill.on.blk{background:var(--red);border-color:var(--red)}
  .pill.on.wd{background:var(--green);border-color:var(--green)}
  .pill.on.re{background:#6a5aa6;border-color:#6a5aa6}
  .pill.mini{font-size:9.5px;padding:1px 7px}
  /* 左页：索引，铺满 */
  .listwrap{flex:1;min-height:240px;display:flex;min-width:0}
  .tree{flex:1;min-width:0;background:var(--paper2);border:1px solid var(--line2);overflow-y:auto;box-shadow:1px 2px 0 rgba(0,0,0,.14)}
  .grp-head{display:flex;align-items:center;gap:6px;padding:7px 9px;font-family:ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.04em;cursor:pointer;user-select:none;border-bottom:1.5px solid var(--line2);background:var(--paper3)}
  .grp-head .caret{color:var(--ink2);width:12px}
  .grp-head .cnt{margin-left:auto;font-weight:400;color:var(--ink2);font-size:10px}
  .subhead{display:flex;align-items:center;gap:6px;padding:4px 9px 4px 18px;font-family:ui-monospace,monospace;font-size:10px;cursor:pointer;user-select:none;background:#e6ddc6;border-bottom:1px dashed var(--line2);color:var(--ink2);letter-spacing:.05em}
  .subhead .caret{width:12px}
  .subhead .cnt{margin-left:auto;font-size:9.5px}
  .item{padding:6px 9px 6px 24px;cursor:pointer;border-bottom:1px dashed #cfc4a9;display:flex;align-items:center;gap:7px;background:var(--paper2)}
  .item:hover{background:#efe6d0}
  .item.sel{background:#e0d6bc;box-shadow:inset 3px 0 0 var(--blue)}
  .item .box{width:12px;height:12px;border:1.5px solid var(--ink2);flex:none;background:transparent}
  .item .box.chk{background:var(--blue);border-color:var(--blue);position:relative}
  .item .box.chk::after{content:"";position:absolute;left:3px;top:0.5px;width:4px;height:7px;border:solid var(--paper2);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
  .item .nm{font-size:11.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .mt{font-size:9px;color:var(--faded);flex:none;font-family:ui-monospace,monospace}
  .qbar{width:3px;height:14px;flex:none}
  .qbar.q4{background:var(--red)}.qbar.q3{background:var(--blue)}.qbar.q2{background:var(--green)}.qbar.q1{background:var(--faded)}
  /* 详情纸 */
  /* 右页：贴在抽屉里的那页纸 */
  .sheetWrap{position:absolute;z-index:3;--k:1}
  /* 邮戳页：纸要压在地图上面，不然整张被盖掉 */
  #shell.onmap .sheetWrap{z-index:9}
  .sheetWrap .shadow{position:absolute;left:calc(-3px * var(--k));top:calc(-2px * var(--k));right:calc(-5px * var(--k));bottom:calc(-7px * var(--k));background:rgba(22,16,9,.38);filter:blur(calc(5px * var(--k)))}
  .sheet{position:absolute;left:0;top:0;width:420px;height:642px;display:block;overflow-y:auto;overflow-x:hidden;background:#E8DDC6;
    padding:calc(14px * var(--k)) calc(16px * var(--k)) calc(12px * var(--k));
    background-image:repeating-linear-gradient(0deg,transparent,transparent calc(21px * var(--k)),rgba(120,105,70,.10) calc(21px * var(--k)),rgba(120,105,70,.10) calc(22px * var(--k)))}
  .sheetWrap .tape{position:absolute;left:50%;top:calc(-24px * var(--k));width:calc(18px * var(--k));height:calc(56px * var(--k));margin-left:calc(-9px * var(--k));
    background:rgba(224,199,136,.55);box-shadow:0 calc(1px * var(--k)) calc(2px * var(--k)) rgba(0,0,0,.22);transform:rotate(.4deg);
    clip-path:polygon(6% 0,94% 0,100% 6%,94% 13%,100% 20%,93% 28%,100% 35%,94% 43%,100% 51%,93% 58%,100% 66%,94% 74%,100% 82%,94% 89%,100% 96%,94% 100%,6% 100%,0 94%,6% 87%,0 80%,7% 73%,0 65%,6% 58%,0 50%,7% 43%,0 35%,6% 28%,0 20%,7% 13%,0 6%)}
  /* 纸上排版 */
  .sh-head{display:flex;align-items:baseline;gap:8px}
  .sh-head h2{font-family:Georgia,"Songti SC",serif;font-size:16px;font-weight:800;letter-spacing:.06em;color:var(--ink)}
  .sh-head .who{margin-left:auto;font-family:ui-monospace,monospace;font-size:9px;color:var(--ink2)}
  .sh-id{font-family:ui-monospace,monospace;font-size:8.5px;color:var(--faded);border-bottom:1px dashed var(--line2);padding:2px 0 5px;margin-bottom:7px}
  .sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .sh-grid .field{margin-bottom:6px}
  .sheet .field{margin-bottom:6px}
  .sheet .field>label{font-size:8.5px;margin-bottom:3px}
  .sheet .field.grow{margin-bottom:0}
  .sheet .body-box{min-height:190px;height:230px;font-size:12.5px;line-height:21px;overflow:auto;resize:vertical}
  .sheet .d-foot{margin-top:6px;padding-top:7px}
  .d-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .d-head h2{font-family:Georgia,"Songti SC",serif;font-size:15px;font-weight:800;letter-spacing:.03em}
  .d-head .who{font-family:ui-monospace,monospace;font-size:10px;color:var(--ink2);margin-left:auto}
  .d-id{font-family:ui-monospace,monospace;font-size:9px;color:var(--faded);margin-bottom:11px;border-bottom:1px dashed var(--line2);padding-bottom:6px}
  .field{margin-bottom:10px}
  .field>label{display:block;font-family:ui-monospace,monospace;font-size:9.5px;font-weight:700;color:var(--ink2);margin-bottom:4px;letter-spacing:.09em}
  .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .chip{font-family:ui-monospace,monospace;font-size:10.5px;padding:3px 9px;border:1px solid var(--line2);background:var(--paper2);cursor:pointer;color:var(--ink2)}

                <span class="pill on" data-f="pol" data-v="*">全部</span><span class="pill" data-f="pol" data-v="注入">注入</span><span class="pill blk" data-f="pol" data-v="拦截">拦截</span><span class="pill" data-f="pol" data-v="停用">停用</span></div>
              <div class="frow"><span class="lab">匹配</span>
                <span class="pill on" data-f="mk" data-v="*">全部</span><span class="pill" data-f="mk" data-v="ss">关键词</span><span class="pill wd" data-f="mk" data-v="wd">词边界</span><span class="pill re" data-f="mk" data-v="re">正则</span></div>

          <div class="listwrap"><div class="tree" id="tree"></div></div>

        <div id="view-state" style="display:none"><div class="sealpaper" id="sealPaper"></div></div>

      <g clip-path="url(#sFolder)">
        <rect width="1200" height="960" fill="url(#sMottle)" style="mix-blend-mode:soft-light" opacity=".3"/>
        <rect width="1200" height="960" fill="url(#sGrain)" style="mix-blend-mode:multiply" opacity=".2"/>

        <rect x="996" y="37" width="9" height="850" fill="#52707e" opacity=".3"/>
        <rect x="1003" y="37" width="3" height="850" fill="#93aab4" opacity=".24"/>

      <path d="M 53 37 L 1113 37 L 1113 409 L 1072 455 L 1072 887 L 53 887 Z" fill="none" stroke="#37505c" stroke-width="2.4" opacity=".45"/>

    <svg class="shellpencil" id="shellpencil" viewBox="0 0 1650 960" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <!-- 铅笔 -->
      <g transform="translate(1066 17) scale(0.94)">
        <g transform="rotate(90)">
          <rect x="0" y="-14" width="520" height="30" fill="#8d7f62" opacity=".16" transform="translate(4,7)"/>
          <path d="M 0 0 L 74 -15 L 74 15 Z" fill="#DED3BC"/>
          <path d="M 0 0 L 74 -15 L 74 -1 Z" fill="#EDE3CE"/>
          <path d="M 0 0 L 26 -5.4 L 26 5.4 Z" fill="#33322f"/>
          <path d="M 0 0 L 26 -5.4 L 26 -1.2 Z" fill="#66645f" opacity=".8"/>

            <rect x="74" y="-15" width="446" height="30" fill="#C6A241"/>
            <rect x="74" y="-15" width="446" height="9" fill="#D6B65C"/>
            <rect x="74" y="4" width="446" height="6" fill="#A8872F"/>
            <rect x="74" y="10" width="446" height="5" fill="#8f7127" opacity=".7"/>
            <rect x="286" y="-15" width="58" height="30" fill="#33312c"/>
            <rect x="0" y="-15" width="520" height="30" fill="url(#sGrain)" style="mix-blend-mode:multiply" opacity=".38"/>
          </g>
          <rect x="492" y="-14" width="26" height="28" fill="#A9A69C"/>
          <rect x="492" y="-14" width="26" height="8" fill="#C4C1B6"/>
          <rect x="492" y="8" width="26" height="6" fill="#8b887e"/>

      </g>

    </svg>
    <div class="maplayer" id="maplayer">
      <div class="mapfold" id="mapfold">收起</div>

</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { hana } from "./assets/sdk.js";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const MOODS = ["满足","开心","平静","烦躁","委屈","低落","落寞"];
  const MOOD_LEVELS = ["轻","中","重"];
  const HUNGER = ["饱","有点饿","饿"];
  const ENERGY = ["精神","有点乏","累"];
  const DESIRE = ["不想","一般","想","主动"];
  let AGENTS = [];
  let NAME = { "": "通用" };
  const opts = (arr, cur) => {
    const list = (cur != null && cur !== "" && !arr.includes(cur)) ? [cur, ...arr] : arr;
    return list.map((v) => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("");
  };
  async function apiFetch(path, init) {
    const fn = hana?.api?.fetch;
    if (typeof fn !== "function") throw new Error("宿主未提供 hana.api.fetch");
    const r = await fn(path, init);
    if (r && typeof r.json === "function") return r.json();
    return r;
  }
  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1600); }

  // ── 页签：五张，当前那张抽到纸前 ──
  const TABS = [
    { v: "state",  n: "封签" },
    { v: "book",   n: "抽屉" },
    { v: "letter", n: "信" },
    { v: "loc",    n: "邮戳" },
    { v: "cfg",    n: "邮箱" },
  ];
  const META = {
    book:   { code:"DR-41 · DRAWER · LOG FILE (Oct '26)", title:"抽 屉", sub:"" },
    state:  { code:"SE-07 · SEAL · LIVE READINGS",        title:"封 签", sub:"三 agent 证件 · 心情 / 饿 / 精力 / 欲望 · 牵挂可增删" },
    letter: { code:"LT-07 · LETTER · DAILY LOG",          title:"信",    sub:"当天日志单 · 选日期回翻" },
    loc:    { code:"PM-07 · POSTMARK · MAP & TRAIL",      title:"邮 戳", sub:"实况 / 预排 · 今日轨迹" },
    cfg:    { code:"BX-07 · MAILBOX · SETTINGS",          title:"邮 箱", sub:"三档 / 主会话 / 角色" },
  };
  let view = "book";
  (function () {
    const back = $("navBack"), front = $("navFront");
    TABS.forEach((t, i) => {
      const d = document.createElement("div");
      d.className = "tn" + (t.v === view ? " t-cur" : "");
      d.dataset.v = t.v; d.dataset.i = i; d.textContent = t.n;
      (t.v === view ? front : back).appendChild(d);
    });
    // 当前那张从纸后抬到纸前，旧的沉回去
    window.__tagFront = (v) => {
      const old = front.querySelector(".tn");
      const next = [...back.children].find((el) => el.dataset.v === v);
      if (next && next !== old) {
        next.classList.add("reveal");
        front.appendChild(next);
        setTimeout(() => next.classList.remove("reveal"), 260);
      }
      if (old && old !== next) {
        old.classList.add("retract");
        back.appendChild(old);
        setTimeout(() => old.classList.remove("retract"), 200);
      }
      [...front.children, ...back.children].forEach((el) => el.classList.toggle("t-cur", el.dataset.v === v));
    };
  })();

  // 详情纸只在「抽屉条目」这一块露出来
  function syncSheet() {
    const sw = $("sheetWrap");
    if (!sw) return;
    const on = document.querySelector(".srctab.on");
    const s = on ? on.dataset.s : "wb";
    sw.style.display = (view === "book" && (s === "wb" || s === "rules")) ? "" : "none";
    if (window.__fitBook) window.__fitBook();
  }

  function showView(v) {
    ["book","state","letter","loc"].forEach((k) => { const el = $("view-" + k); if (el) el.style.display = k === v ? "" : "none"; });
    syncSheet();
    $("cfgPanel").style.display = v === "cfg" ? "" : "none";
    const cb = $("cardbox");
    if (cb) cb.classList.toggle("on", v === "state");
    if (v === "cfg") loadCfg();
    $("hdrCode").textContent = v === "letter" ? "" : META[v].code;
    $("hdrTitle").textContent = META[v].title;
    $("stampBox").style.display = v === "book" ? "" : "none";
    $("subline").innerHTML = META[v].sub ? `<span>${META[v].sub}</span>` : "";
    if (window.__tagFront) window.__tagFront(v);
  }

  // ══════════ 换页：抽屉带着纸进去，换完再出来 ══════════
  const DR_IN = -600, DR_REST = -40;
  const EASE_IN = "cubic-bezier(.4,.05,.2,1)";
  const EASE_OUT = "cubic-bezier(.55,0,.25,1)";
  let swapBusy = false;
  const nap = (ms) => new Promise((r) => setTimeout(r, ms));

  // 抽屉和纸是一条皮：同一个位移、同一条曲线
  function slideDrawer(to, dur, ease) {
    const k = window.__shellK || 1;
    const dr = document.getElementById("mDrawer");
    const sw = document.getElementById("sheetWrap");
    if (dr) {
      dr.style.transition = `transform ${dur}ms ${ease}`;
      dr.style.transform = `translateX(${to}px)`;
    }
    if (sw) {
      sw.style.transition = `transform ${dur}ms ${ease}`;
      sw.style.transform = `translateX(${((to - DR_REST) * k).toFixed(1)}px)`;
    }
    const cb = document.getElementById("cardbox");
    if (cb) {
      cb.style.transition = `transform ${dur}ms ${ease}`;
      cb.style.transform = `translateX(${((to - DR_REST) * k).toFixed(1)}px) scale(${k.toFixed(4)})`;
    }
  }

  // 邮戳页不用另做一层：把它自己那一块搬到大地方，原地放大
  let locHome = null;

  function mapOn() {
    const el = $("maplayer"), v = $("view-loc");
    if (!el || !v) return;
    // 每次进来都从城市地图开始：楼层图关掉、地图复位
    closeFloor(v);
    v.querySelectorAll(".ptab").forEach((t) => t.classList.toggle("on", t.dataset.f === "1"));
    if (!locHome) locHome = { parent: v.parentNode, next: v.nextSibling };
    el.appendChild(v);
    el.classList.add("on");
  }
  function mapOff() {
    const el = $("maplayer"), v = $("view-loc");
    if (el) el.classList.remove("on");
    if (v) {
      const fl = v.querySelector("#floorbox");
      if (fl && fl.classList.contains("show")) closeFloor(v);
    }
    if (v && locHome && locHome.parent) locHome.parent.insertBefore(v, locHome.next);
  }

  async function goPage(v) {
    if (swapBusy || v === view) return;
    swapBusy = true;
    const watchdog = setTimeout(() => { swapBusy = false; }, 2500);   // 兜底：卡住也自己放开
    try {
    const toLoc = v === "loc";
    const fromLoc = view === "loc";

    if (fromLoc) { mapOff(); await nap(280); }          // 地图先收
    // 进邮戳页：抽屉不收，留着露在外面；去其他页才收进去
    if (!fromLoc && !toLoc) {
      slideDrawer(DR_IN, 340, EASE_IN);
      await nap(370);
    }
    view = v;
    showView(view);                                     // 看不见的时候才换
    $("shell").classList.toggle("onmap", toLoc);
    if (view === "book") loadBook();
    if (view === "state") loadSeal();
    if (view === "letter") loadLetter();
    if (view === "loc") loadLoc();
    await nap(90);

    if (toLoc) {                                        // 邮戳：铺开，抽屉留在里面
      await nap(120);
      mapOn();
    } else {
      slideDrawer(DR_REST, 420, EASE_OUT);              // 新的东西跟着出来
    }
    await nap(430);
    } finally {
      clearTimeout(watchdog);
      swapBusy = false;
    }
  }

  // 收起：楼层图 → 地图 → 抽屉，一次退干净
  async function exitMap() {
    const v = $("view-loc");
    if (v) {
      const fl = v.querySelector("#floorbox");
      if (fl && fl.classList.contains("show")) closeFloor(v);
    }
    swapBusy = false;              // 不管上一次卡没卡，这里直接接管
    await goPage("book");
  }

  const _fold = document.getElementById("mapfold");
  if (_fold) _fold.onclick = (e) => { e.stopPropagation(); exitMap(); };

  document.addEventListener("click", (e) => {
    const t = e.target.closest(".tabsnav .tn");
    if (!t) return;
    goPage(t.dataset.v);
  });

  // ══════════ 封签：抽屉里的证件卡 ══════════
  let SEAL = null, SEALSEL = "";

  function sealOpts(arr, cur, blank) {
    const head = blank ? `<option value="">${esc(blank)}</option>` : "";
    return head + opts(arr, cur || "");
  }

  // 真实模式：开着的时候面板什么都写不进去（后端也会拦），她自己照样能写。
  let REAL = false;
  async function loadRealMode() {
    try { const r = await apiFetch("/real-mode"); REAL = r?.on === true; } catch { REAL = false; }
  }

  async function loadSeal() {
    let d = null;
    try { d = await apiFetch("/seal"); } catch { d = null; }
    if (d && typeof d === "object") SEAL = d;
    else SEAL = SEAL || {};

    // 角色表从后端来（/seal 的 key 就是配置里的角色）。以前写死三个，
    // 新加的人有卡但抽屉/信/规则库都不显示她。
    const keys = Object.keys(SEAL || {});
    if (keys.length) {
      AGENTS = keys;
      NAME = { "": "通用" };
      for (const k of keys) NAME[k] = (SEAL[k] && SEAL[k].name) || k;
      if (!keys.includes(SEALSEL)) SEALSEL = keys[0];
    }

    await renderCards();
    renderLetter();
  }

  async function renderCards() {
    const box = $("cardbox");
    if (!box) return;
    const keys = Object.keys(SEAL || {});
    const list = keys.length ? AGENTS.filter((a) => keys.includes(a)) : AGENTS;
    // 卡盒排法随张数走：先算每张能露多少，不够就让卡缩窄
    const n = list.length + 1;                 // 人物卡 + 卡背
    const TOP = 35, BOTTOM = 725;              // 抽屉内可用区间
    const ROOM = BOTTOM - TOP;
    let W = 354;
    let H = Math.round(W / 1.586);
    let band = n > 1 ? Math.min(133, Math.floor((ROOM - H) / (n - 1))) : 0;
    if (band < 44 && n > 1) {
      band = 44;
      H = Math.max(120, ROOM - band * (n - 1));
      W = Math.round(H * 1.586);
    }
    const k = +(W / 370).toFixed(4);
    const LEFT = Math.round((466 - W) / 2);
    const parts = [];
    let i = 0;
    for (const a of list) {
      const s = SEAL?.[a] || {};
      const av = await ava(a);
      const sel = a === SEALSEL;
      const lv = s.moodLevel || "";
      const nm = NAME[a] || s.name || a;
      const top = TOP + i * band;
      parts.push(`<div class="cw" style="left:${LEFT}px;top:${top}px;width:${W}px;height:${H}px;z-index:${i + 1}"><div class="idcard${sel ? " on" : ""}" data-a="${a}" style="transform:scale(${k})">
        <div class="topbar"></div>
        <div class="band"></div>
        <div class="ph">${av ? `<img src="${av}" alt="">` : "照片"}</div>
        <div class="hd"><div class="nm">${esc(nm)}</div></div>
        <div class="rows">
          <div class="r"><span class="k">MOOD</span><span class="v">${esc(s.mood || "无")}${(s.moodLevelNow || lv) ? `<s>${esc(s.moodLevelNow || lv)}</s>` : ""}</span></div>
          <div class="r"><span class="k">HUNGER</span><span class="v">${esc(s.hungerNow || s?.body?.hunger || "无")}</span></div>
          <div class="r"><span class="k">ENERGY</span><span class="v">${esc(s?.body?.energy || "无")}</span></div>
          <div class="r"><span class="k">DESIRE</span><span class="v">${esc(s.desire || "无")}</span></div>
        </div>
        <div class="arcs"></div>
      </div></div>`);
      i++;
    }
    const btop = TOP + i * band;
    parts.push(`<div class="cw" style="left:${LEFT}px;top:${btop}px;width:${W}px;height:${H}px;z-index:${i + 1}"><div class="back" id="newChar" style="transform:scale(${k})">
      <div class="plus">＋</div>
      <svg width="132" height="132" viewBox="0 0 200 200" fill="none" stroke="#ffffff" stroke-width="2.4">
        <circle cx="100" cy="96" r="62" opacity=".5"/>
        <path d="M58 60 q-26 36 0 72 q26 -36 0 -72" opacity=".55"/>
        <path d="M142 60 q26 36 0 72 q-26 -36 0 -72" opacity=".55"/>
        <path d="M100 52 l8 20 22 2 -17 15 5 22 -18 -12 -18 12 5 -22 -17 -15 22 -2z" opacity=".75"/>
        <path d="M74 118 q26 22 52 0" opacity=".55"/>
      </svg>
      <div class="cap">ORCHARD · SEAL<small>NEW RECORD</small></div>
    </div></div>`);
    box.innerHTML = parts.join("");
  }

  function markSel() {
    document.querySelectorAll("#cardbox .idcard").forEach((el) => el.classList.toggle("on", el.dataset.a === SEALSEL));
  }

  function wdOf(dateStr) {
    const d = new Date(dateStr + "T00:00:00+08:00");
    if (isNaN(d)) return "";
    return "周" + "日一二三四五六"[d.getDay()];
  }

  const CN = ["零","一","二","三","四","五","六","七","八","九","十"];
  function cnN(n) {
    n = Number(n);
    if (!isFinite(n)) return "";
    if (n <= 10) return CN[n] || "";
    if (n < 20) return "十" + CN[n - 10];
    return CN[Math.floor(n / 10)] + "十" + (n % 10 ? CN[n % 10] : "");
  }
  function cnDate(d) {
    const m = String(d || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? cnN(+m[2]) + "月" + cnN(+m[3]) + "日" : (d || "");
  }

  function sealLetterHTML(a) {
    const s = SEAL?.[a] || {};
    const nm = NAME[a] || a;
    const date = s.date || "";
    const pick = (k, arr, cur) => `<select class="le" data-k="${k}"${REAL ? " disabled" : ""}>${sealOpts(arr, cur, "无")}</select>`;
    const sep = `<span class="sep">·</span>`;
    const dtBits = [cnDate(date), wdOf(date), s.weather || ""].filter(Boolean).join("　");
    const why = String(s.moodWhy || "").trim() || "无";
    const o = s.orientation || {};
    const care = Array.isArray(s.care) ? s.care : [];
    const sp = Array.isArray(s.special) ? s.special : [];
    const careTxt = care.length
      ? care.map((c) => `${c.with} —— ${c.about}${c.since ? `，${c.since} 起` : ""}`).join("\n")
      : "无";
    const orientTxt = o.main?.line ? esc(o.main.line) + (o.main.how ? `（${esc(o.main.how)}）` : "") : "无";
    const underTxt = (s.moodUnderNow?.word || s.moodUnder?.word)
      ? esc(s.moodUnderNow?.word || s.moodUnder.word) + ((s.moodUnderNow?.level || s.moodUnder?.level) ? ` · ${esc(s.moodUnderNow?.level || s.moodUnder.level)}` : "")
      : "无";
    const foot = date ? date.slice(2).replace(/-/g, " · ") : "";

    return `<div class="letter">
      <i class="cor tl"></i><i class="cor tr"></i><i class="cor bl"></i><i class="cor br"></i>
      <div class="class">SE-07 · PRIVATE CORRESPONDENCE</div>
      <div class="hr"></div>
      <div class="main">
        <div class="nm">${esc(nm)}</div>
        <div class="dt">${esc(dtBits)}</div>
        <div class="hr" style="margin-top:12px"></div>
        <div class="sec-t">今日记录</div>
        <div class="txt">${esc(why)}</div>
        <div class="sec-t">牵挂</div>
        <div class="txt">${esc(careTxt)}</div>
        <div class="sec-t">朝向</div>
        <div class="txt">${orientTxt}</div>
        <div class="grp-sep"></div>
        <div class="g"><span class="k">心情</span><span>${pick("mood", MOODS, s.mood)}${sep}${pick("moodLevel", MOOD_LEVELS, s.moodLevelNow || s.moodLevel)}</span></div>
        <div class="g"><span class="k">身体</span><span>${pick("bodyHunger", HUNGER, s.hungerNow || s?.body?.hunger)}${sep}${pick("bodyEnergy", ENERGY, s?.body?.energy)}${sep}${pick("desire", DESIRE, s.desire)}</span></div>
        <div class="g"><span class="k">底层</span><span>${underTxt}</span></div>
        <div class="g"><span class="k">特殊</span><span>${sp.length ? esc(sp.join("、")) : "无"}</span></div>
        <div class="sign">—— ${esc(nm)}</div>
      </div>
      <div class="hr"></div>
      <div class="foot"><span class="l">PERSONAL RECORD</span>${s.source === "user" ? `<span class="ldel" id="delCard">删卡</span>` : ""}<span class="r">${esc(foot)}</span></div>
    </div>`;
  }

  function renderLetter() {
    const p = $("sealPaper");
    if (p) p.innerHTML = sealLetterHTML(SEALSEL);
  }

  // ══════════ 开卡：左页一张表单 ══════════
  let NEWMODE = "new", NEWTPL = "", NEWAVATAR = "", DELARM = null, NEWTZ = "Asia/Shanghai";
  const TZS = ["Asia/Shanghai", "Asia/Tokyo", "Asia/Seoul", "Asia/Hong_Kong", "Asia/Taipei", "Asia/Singapore", "Asia/Bangkok", "Asia/Kolkata", "Asia/Dubai", "Europe/London", "Europe/Paris", "Europe/Berlin", "Europe/Moscow", "America/New_York", "America/Chicago", "America/Denver", "America/Los_Angeles", "America/Sao_Paulo", "Australia/Sydney", "Pacific/Auckland", "UTC"];

  function openNewForm() {
    NEWMODE = "new";
    // 新建就是套向导的骨架（人格、世界书、三封信、头像），不用再选模板
    NEWTPL = "";
    NEWAVATAR = "";
    renderNewForm();
  }

  function renderNewForm() {
    const p = $("sealPaper");
    if (!p) return;
    const isNew = NEWMODE === "new";
    const pane = isNew ? `
      <div class="lf"><span class="k">ID</span><input id="nfId" placeholder="英文小写，建好不能改"></div>
      <div class="lf"><span class="k">名字</span><input id="nfName" placeholder="她叫什么"></div>
      <div class="lf"><span class="k">别称</span><input id="nfAlias" placeholder="用逗号分开，可空"></div>
      <div class="lf"><span class="k">时区</span><span class="tzwrap" id="nfTzW"><span class="tzfield" id="nfTzF">${esc(NEWTZ)} ▾</span><div class="tzlist" id="nfTzL">${TZS.map((t) => `<div class="tzitem${t === NEWTZ ? " now" : ""}" data-tz="${t}">${t}</div>`).join("")}<div class="tzitem custom" data-tz="__custom">自定义…</div></div></span></div>
      <div class="lf"><span class="k">她是谁</span><textarea id="nfWho" placeholder="两三句：名字、身份、底色"></textarea></div>
      <div class="lf"><span class="k">最想要的</span><input id="nfWant" placeholder="她嘴上要的东西"></div>
      <div class="lf"><span class="k">最怕的</span><input id="nfNeed" placeholder="她真正需要、却一直躲着的那件事"></div>
      <div class="lf"><span class="k">模板</span><span class="lpick"><span class="lopt" data-tpl="guide">金 · 向导</span></span></div>
      <div class="lf"><span class="k">接入</span><span class="lpick" id="adoptList"><span style="opacity:.5;font-size:10px">读…</span></span></div>
      <div class="lf"><span class="k">照片</span><input id="nfPhoto" type="file" accept="image/*" style="border:0;padding:0"></div>` : `
      <div class="lf"><span class="k">ST 卡</span><textarea id="nfJson" placeholder='{"spec":"chara_card_v2","data":{...}}'></textarea></div>
      <div class="lf"><span class="k">文件</span><input id="nfFile" type="file" accept=".json" style="border:0;padding:0"></div>
      <div class="lf"><span class="k">ID</span><input id="nfImpId" placeholder="留空就自动生成 char-xxx"></div>`;

    p.innerHTML = `<div class="letter">
      <i class="cor tl"></i><i class="cor tr"></i><i class="cor bl"></i><i class="cor br"></i>
      <div class="class">SE-07 · NEW RECORD</div>
      <div class="hr"></div>
      <div class="main">
        <div class="nm" style="font-size:23px">开 一 张 新 卡</div>
        <div class="dt">橘子树 · 人物档案 · 建好之后左边就是她的信</div>
        <div class="ltabs">
          <div class="ltab${isNew ? " on" : ""}" data-m="new">新建人物</div>
          <div class="ltab${isNew ? "" : " on"}" data-m="import">导入 ST 卡</div>
        </div>
        ${pane}
      </div>
      <div class="hr"></div>
      <div class="foot" style="margin-top:10px">
        <span class="l">PERSONAL RECORD</span>
        <span class="lcancel" id="ncCancel" style="margin-left:auto">取消</span>
        <span class="lgo" id="ncGo" style="margin-left:14px">${isNew ? "建" : "导入"}</span>
      </div>
    </div>`;

    document.querySelectorAll("#sealPaper .ltab").forEach((t) => t.onclick = () => { NEWMODE = t.dataset.m; renderNewForm(); });
    document.querySelectorAll("#sealPaper .lopt").forEach((o) => o.onclick = async () => {
      document.querySelectorAll("#sealPaper .lopt").forEach((x) => x.classList.toggle("on", x === o));
      NEWTPL = o.dataset.tpl || "";
      if (NEWTPL !== "guide") return;
      // 一键把金的全部选项填上：id / 名字 / 时区 / 头像
      const nm = $("nfName"), idf = $("nfId"), tzf = $("nfTzF");
      if (nm && !nm.value.trim()) nm.value = "金";
      if (idf && !idf.value.trim()) {
        let ids = [];
        try { const r = await apiFetch("/characters"); ids = (r?.items || []).map((x) => x.id); } catch { /* 拿不到就默认 kim */ }
        idf.value = ids.includes("kim") ? "kim-2" : "kim";
      }
      NEWTZ = "America/New_York";
      if (tzf) tzf.textContent = NEWTZ + " ▾";
      try { const r = await apiFetch("/avatar/_kim"); if (r?.ok) NEWAVATAR = r.dataUrl; } catch { /* 头像可选 */ }
      toast("套用金：人格、世界书、三封信、头像");
    });
    $("ncCancel").onclick = () => renderLetter();
    if (isNew) {
      bindTz();
      // 接入已有助手：宿主里已经有的 agent，点一下就接管（不用从零建）
      (async () => {
        const box = $("adoptList");
        if (!box) return;
        let d = null;
        try { d = await apiFetch("/agents/scan"); } catch { d = null; }
        const items = ((d && d.items) || []).filter((x) => !x.adopted);
        if (!items.length) {
          box.innerHTML = `<span style="opacity:.45;font-size:10px">没有可接入的助手</span>`;
          return;
        }
        box.innerHTML = items.map((x) => `<span class="lopt" data-adopt="${esc(x.id)}">${esc(x.name)}</span>`).join("");
        box.querySelectorAll("[data-adopt]").forEach((el) => el.onclick = async () => {
          const id = el.dataset.adopt;
          el.textContent = "接入中…";
          const r = await apiFetch("/agents/adopt", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ id }),
          }).catch(() => null);
          if (r?.ok) {
            toast(`接进来了：${r.name || id}（重开 Hana 后进时钟与注入）`);
            SEAL = null;
            await loadSeal();
          } else {
            toast(r?.err || "没接进来");
            el.textContent = id;
          }
        });
      })();
      $("nfPhoto").onchange = () => {
        const f = $("nfPhoto").files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => { NEWAVATAR = String(rd.result || ""); toast("照片记住了"); };
        rd.readAsDataURL(f);
      };
      $("ncGo").onclick = submitNew;
    } else {
      $("nfFile").onchange = () => {
        const f = $("nfFile").files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => { $("nfJson").value = String(rd.result || ""); };
        rd.readAsText(f);
      };
      $("ncGo").onclick = submitImport;
    }
  }

  function tzMarkup() {
    return `<span class="tzfield" id="nfTzF">${esc(NEWTZ)} ▾</span><div class="tzlist" id="nfTzL">${TZS.map((t) => `<div class="tzitem${t === NEWTZ ? " now" : ""}" data-tz="${t}">${t}</div>`).join("")}<div class="tzitem custom" data-tz="__custom">自定义…</div></div>`;
  }

  function bindTz() {
    const w = $("nfTzW");
    if (!w) return;
    w.innerHTML = tzMarkup();
    const f = $("nfTzF"), l = $("nfTzL");
    if (!f || !l) return;
    f.onclick = () => l.classList.toggle("on");
    l.querySelectorAll(".tzitem").forEach((it) => it.onclick = () => {
      const t = it.dataset.tz;
      if (t === "__custom") {
        w.innerHTML = `<input class="tzinput" id="nfTzC" value="${esc(NEWTZ)}" placeholder="如 Asia/Shanghai">`;
        const inp = $("nfTzC");
        inp.focus();
        inp.select();
        inp.oninput = () => { NEWTZ = inp.value.trim(); };
        return;
      }
      NEWTZ = t;
      bindTz();
    });
  }

  async function submitNew() {
    const id = ($("nfId").value || "").trim().toLowerCase();
    const name = ($("nfName").value || "").trim();
    if (!id || !name) { toast("id 和名字都要填"); return; }
    const body = {
      id, name,
      aliases: ($("nfAlias").value || "").split(/[,，、]/).map((x) => x.trim()).filter(Boolean),
      timezone: NEWTZ,
      who: ($("nfWho").value || "").trim(),
      want: ($("nfWant").value || "").trim(),
      need: ($("nfNeed").value || "").trim(),
    };
    if (NEWTPL) body.from = NEWTPL;
    if (NEWAVATAR) body.avatar = NEWAVATAR;
    try {
      const r = await apiFetch("/characters/create", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      if (!r?.ok) { toast(r?.err || "没建成"); return; }
      delete AVCACHE[r.id];
      // 包建好了，接着把 agent 也建出来
      let agentMsg = "";
      try {
        const ra = await apiFetch("/characters/" + encodeURIComponent(r.id) + "/agent", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ yuan: "hanako" }) });
        agentMsg = ra?.ok ? (ra.warning ? `，${ra.warning}` : "，agent 也建好了") : `，agent 没建成：${ra?.err || "?"}`;
      } catch (e) { agentMsg = "，agent 没建成"; }
      toast("建好了：" + name + agentMsg + "（重开 Hana 后才会跑时钟与注入）");
      SEAL = null;
      SEALSEL = r.id;
      NEWAVATAR = "";
      await loadSeal();
    } catch { toast("请求失败"); }
  }

  async function submitImport() {
    let card;
    try { card = JSON.parse($("nfJson").value || ""); } catch { toast("JSON 读不出来"); return; }
    const id = ($("nfImpId").value || "").trim().toLowerCase();
    try {
      const r = await apiFetch("/characters/import", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ card, id: id || undefined }) });
      if (!r?.ok) { toast(r?.err || "没导入"); return; }
      // 导入和新建一样，包建好了就得把 agent 也建出来——不然卡只是个文件夹
      let agentMsg = "";
      try {
        const ra = await apiFetch("/characters/" + encodeURIComponent(r.id) + "/agent", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ yuan: "hanako" }) });
        agentMsg = ra?.ok ? (ra.warning ? `，${ra.warning}` : "，agent 也建好了") : `，agent 没建成：${ra?.err || "?"}`;
      } catch (e) { agentMsg = "，agent 没建成"; }
      toast("导入 " + (r.name || "") + "，抽屉 " + (r.entries || 0) + " 条" + agentMsg);
      SEAL = null;
      SEALSEL = r.id || SEALSEL;
      await loadSeal();
    } catch { toast("请求失败"); }
  }

  $("cardbox").addEventListener("click", (e) => {
    if (e.target.closest("#newChar")) { openNewForm(); return; }
    const c = e.target.closest(".idcard");
    if (!c) return;
    SEALSEL = c.dataset.a;
    markSel();
    renderLetter();
  });

  async function sealSet(a, k, v) {
    const body = { agentId: a, [k]: v };
    try {
      const r = await apiFetch("/seal/set", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      if (r?.ok) { toast((r.notes || []).join(" · ") || "写上了"); SEAL = null; await loadSeal(); }
      else toast(r?.err || "没写进去");
    } catch { toast("请求失败"); }
  }

  // 改值只在信上：卡只读
  $("sealPaper").addEventListener("change", (e) => {
    const sel = e.target.closest("select[data-k]");
    if (!sel || !sel.value) return;
    sealSet(SEALSEL, sel.dataset.k, sel.value);
  });

  // 删卡：第一次点先问一句，再点一次才真删
  $("sealPaper").addEventListener("click", async (e) => {
    const del = e.target.closest("#delCard");
    if (!del) return;
    if (DELARM !== SEALSEL) {
      DELARM = SEALSEL;
      del.classList.add("armed");
      del.textContent = "再点一次就删";
      return;
    }
    DELARM = null;
    const a = SEALSEL;
    try {
      const r = await apiFetch("/characters/delete", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: a }) });
      if (r?.ok) { toast("删了"); SEAL = null; SEALSEL = ""; delete AVCACHE[a]; await loadSeal(); }
      else toast(r?.err || "没删掉");
    } catch { toast("请求失败"); }
  });

  // ══════════ 世界书 ══════════
  const MKLBL = { ss:"关键词", wd:"词边界", re:"正则" };
  // 库里的 priority 就是刻度本身：100（人格锚/恒保）·75（容器/重头戏）·50（普通）·25（点缀）
  // 不再做旧刻度换算——换算过一次就把库写回旧值，整库乱掉。
  const toQ = (p) => {
    const n = Number(p);
    if (!Number.isFinite(n)) return 50;
    return n >= 100 ? 100 : n >= 75 ? 75 : n >= 50 ? 50 : 25;
  };
  const toP = (q) => (q >= 100 ? 100 : q >= 75 ? 75 : q >= 50 ? 50 : 25);
  const qcls = (q) => q >= 100 ? "q4" : q >= 75 ? "q3" : q >= 50 ? "q2" : "q1";
  const THRESHOLD = 75;

  let BOOK = [], CUR = null, SMODE = "q", SEL = new Set(), LINKS = {};
  const FD = new Set();
  const F = { pol: "*", mk: "*" };

  function polOf(e) { return !e.enabled ? "停用" : (e.policy === "block" ? "拦截" : "注入"); }
  function mkOf(e) { return e.match === "word" ? "wd" : e.match === "regex" ? "re" : "ss"; }
  function filtered() {
    const kw = ($("q").value || "").trim().toLowerCase();
    return BOOK.filter((e) => {
      if (F.pol !== "*" && polOf(e) !== F.pol) return false;
      if (F.mk !== "*" && mkOf(e) !== F.mk) return false;
      if (kw) {
        const hay = (e.name + " " + (e.trigger || []).join(" ") + " " + e.body).toLowerCase();
        if (!hay.includes(kw)) return false;
      }
      return true;
    });
  }
  const MKO = { ss:0, wd:1, re:2 }, POLO = { "注入":0, "拦截":1, "停用":2 };
  function sortItems(arr) {
    return [...arr].sort((a, b) => {
      if (SMODE === "date") { const d = String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")); if (d) return d; }
      if (MKO[mkOf(a)] !== MKO[mkOf(b)]) return MKO[mkOf(a)] - MKO[mkOf(b)];
      if (POLO[polOf(a)] !== POLO[polOf(b)]) return POLO[polOf(a)] - POLO[polOf(b)];
      return toQ(b.priority) - toQ(a.priority) || String(a.name).localeCompare(String(b.name), "zh");
    });
  }

  async function loadBook() {
    if (!BOOK.length) {
      $("tree").innerHTML = `<div class="empty">读取中…</div>`;
      const r = await apiFetch("/drawer");
      if (!r?.ok) { $("tree").innerHTML = `<div class="empty">读失败：${esc(r?.err || "?")}</div>`; return; }
      BOOK = r.items || [];
      $("subline").innerHTML = `<span>条目 ${BOOK.length}</span><span>${AGENTS.length ? AGENTS.length + " 人：" + AGENTS.map((a) => NAME[a] || a).join(" / ") : "未配角色"}</span>`;
      try { const lk = await apiFetch("/links"); if (lk?.ok) LINKS = lk.idx || {}; } catch { /* 映射可选 */ }
    }
    renderBook();
  }

  function renderBook() {
    const list = filtered();
    $("cOvN").textContent = list.filter((e) => toQ(e.priority) >= THRESHOLD).length + " 条";
    $("cKdN").textContent = list.filter((e) => toQ(e.priority) < THRESHOLD).length + " 条";
    $("cBlkN").textContent = list.filter((e) => polOf(e) === "拦截").length + " 条";

    const groups = {};
    for (const e of list) (groups[e.agentId] || (groups[e.agentId] = [])).push(e);
    // 分组顺序：通用 → 配置里的角色 → 库里多出来的（测试残留之类，放最后但不藏）
    const order = ["", ...AGENTS];
    for (const g of Object.keys(groups)) if (!order.includes(g)) order.push(g);
    let html = "";
    for (const g of order) {
      const gs = groups[g] || [];
      if (!gs.length) continue;
      const open = !FD.has("g:" + g);
      html += `<div class="grp-head" data-k="g:${g}"><span class="caret">${open ? "▾" : "▸"}</span>${NAME[g] || g}<span class="cnt">${gs.length}</span></div>`;
      if (!open) continue;
      const ov = gs.filter((e) => toQ(e.priority) >= THRESHOLD);
      const kd = gs.filter((e) => toQ(e.priority) < THRESHOLD);
      html += `<div class="grp-body">`;
      if (ov.length) {
        const k = "ov:" + g, o = !FD.has(k);
        html += `<div class="subhead" data-k="${k}"><span class="caret">${o ? "▾" : "▸"}</span>总览<span class="cnt">${ov.length}</span></div>`;
        if (o) html += sortItems(ov).map(itemHtml).join("");
      }
      if (kd.length) {
        const k = "kd:" + g, o = !FD.has(k);
        html += `<div class="subhead" data-k="${k}"><span class="caret">${o ? "▾" : "▸"}</span>细节<span class="cnt">${kd.length}</span></div>`;
        if (o) html += sortItems(kd).map(itemHtml).join("");
      }
      html += `</div>`;
    }
    $("tree").innerHTML = html || `<div class="empty">没有符合条件的条目</div>`;
    $("tree").querySelectorAll(".grp-head,.subhead").forEach((h) => h.onclick = (e) => {
      e.stopPropagation(); const k = h.dataset.k; FD.has(k) ? FD.delete(k) : FD.add(k); renderBook();
    });
    $("tree").querySelectorAll(".item").forEach((el) => el.onclick = (e) => {
      if (e.target.dataset.chk) { const id = e.target.dataset.chk; SEL.has(id) ? SEL.delete(id) : SEL.add(id); renderBook(); return; }
      CUR = el.dataset.id; renderBook(); renderDetail();
    });
    $("bcn").textContent = SEL.size;
    $("batch").classList.toggle("show", SEL.size > 0);
    updateFsum();
    renderDetail();
  }

  function itemHtml(e) {
    const sel = CUR === e.id, chk = SEL.has(e.id), q = toQ(e.priority);
    return `<div class="item ${sel ? "sel" : ""}" data-id="${esc(e.id)}"><span class="box ${chk ? "chk" : ""}" data-chk="${esc(e.id)}"></span><span class="qbar ${qcls(q)}"></span><span class="nm">${esc(e.name)}</span>${SMODE === "date" ? `<span class="mt">${esc((e.updatedAt || "").slice(5, 16).replace("T", " "))}</span>` : ""}</div>`;
  }

  function renderDetail() {
    const d = $("detail");
    const e = BOOK.find((x) => x.id === CUR);
    if (!e) { d.innerHTML = `<div class="empty">左边点一条，详情落这儿</div>`; return; }
    const pol = polOf(e), mk = mkOf(e), q = toQ(e.priority);
    d.innerHTML = `
      <div class="sh-head"><h2>${esc(e.name)}</h2><span class="who">${NAME[e.agentId] || e.agentId || "通用"} · ${pol}</span></div>
      <div class="sh-id">ID ${esc(e.id)} · ${esc((e.updatedAt || "").slice(0, 16).replace("T", " "))}</div>
      <div class="sh-grid">
        <div class="field"><label>归属</label><div class="chips">${["", ...AGENTS].map((a) => `<span class="chip ${String(e.agentId || "") === a ? "on" : ""}">${esc(a ? (NAME[a] || a) : "通用")}</span>`).join("")}</div></div>
        <div class="field"><label>档位</label><div class="lv">${[100,75,50,25].map((x) => `<span data-q="${x}" class="${q===x?"on":""}">${x}</span>`).join("")}</div></div>
        <div class="field"><label>匹配</label><div class="chips">${["关键词","词边界","正则"].map((m) => `<span class="chip ${mk === (m==="正则"?"re":m==="词边界"?"wd":"ss") ? "on" : ""}">${m}</span>`).join("")}</div></div>
        <div class="field"><label>策略</label><div class="chips">${["注入","拦截","停用"].map((p) => `<span class="chip ${pol === p ? "on " + (p==="拦截"?"blk":"") : ""}">${p}</span>`).join("")}</div></div>
      </div>
      <div class="field"><label>触发词</label><div class="trigs" id="dTrigs">${(e.trigger || []).map((t) => `<span class="trig">${esc(t)}<span class="x" data-del="${esc(t)}" title="删掉">✕</span></span>`).join("")}<span class="trig add" id="trigAdd">+ 加词</span></div></div>
      ${relBlock()}
      <div class="field grow"><label>正文</label><textarea class="body-box" id="dBody">${esc(e.body || "")}</textarea></div>
      <div class="d-foot"><button class="btn primary" id="dSave">保存</button><button class="btn" id="dReset">重置</button><button class="btn danger" id="dDel" style="margin-left:auto">删除</button></div>
    `;
    d.querySelectorAll(".trig .x[data-del]").forEach((x) => x.onclick = async () => {
      const rest = (e.trigger || []).filter((t) => t !== x.dataset.del);
      await saveEntry(e.id, { trigger: rest }, e.name);
    });
    const ta = d.querySelector("#trigAdd");
    if (ta) ta.onclick = () => {
      if (d.querySelector("#trigNew")) return;
      const inp = document.createElement("input");
      inp.id = "trigNew"; inp.placeholder = "新触发词，回车";
      inp.style.cssText = "font:inherit;font-size:10.5px;padding:2px 6px;border:1px solid var(--line2);background:#fdfaf0;color:var(--ink);width:110px";
      ta.parentNode.insertBefore(inp, ta);
      inp.focus();
      const commit = async () => {
        const v = inp.value.trim();
        if (!v) { inp.remove(); return; }
        const next = Array.from(new Set([...(e.trigger || []), v]));
        await saveEntry(e.id, { trigger: next }, e.name);
      };
      inp.onkeydown = (ev) => { if (ev.key === "Enter") commit(); if (ev.key === "Escape") inp.remove(); };
      inp.onblur = () => commit();
    };
    d.querySelectorAll(".field .chips .chip").forEach((c) => c.onclick = async () => {
      const txt = c.textContent.trim();
      if (["关键词","词边界","正则"].includes(txt)) {
        const val = txt === "正则" ? "regex" : txt === "词边界" ? "word" : "substring";
        await saveEntry(e.id, { match: val }, e.name);
      } else if (["注入","拦截","停用"].includes(txt)) {
        if (txt === "停用") await saveEntry(e.id, { enabled: false }, e.name);
        else await saveEntry(e.id, { enabled: true, policy: txt === "拦截" ? "block" : "inject" }, e.name);
      }
    });

  function relBlock() {

  /** 关系只读：总览（挂在谁底下）/ 细节（底下有谁）/ 对位 / 同题 */
  async function fillRel(e) {
    const box = document.getElementById("relBox");
    if (!box) return;
    let r = null;
    try { r = await apiFetch(`/drawer/link?id=${encodeURIComponent(e.id)}`); } catch { r = null; }
    const parents = r?.parents || [];
    const children = r?.children || [];
    const L = LINKS[e.id] || {};
    const jump = (t, id) => `<span class="rel-jump" data-jump="${esc(id)}">${esc(t)}</span>`;
    const unlinkBtn = (pid) => `<span data-unlink="${esc(pid)}" title="拿下来" style="margin-left:2px;cursor:pointer;color:#a8443c;font-weight:700">×</span>`;
    const rows = [];
    if (parents.length) rows.push(`<div class="rel-row"><span class="tag">总览</span>${parents.map((p) => jump(p.parentName || p.parentId, p.parentId) + unlinkBtn(p.parentId)).join("<span class='rel-sep'>·</span>")}</div>`);
    if (children.length) rows.push(`<div class="rel-row"><span class="tag">细节</span>${children.map((c) => jump(c.childName || c.childId, c.childId)).join("<span class='rel-sep'>·</span>")}</div>`);
    if ((L.peer || []).length) rows.push(`<div class="rel-row"><span class="tag">对位</span>${L.peer.map((p) => jump(p.name, p.id)).join("<span class='rel-sep'>·</span>")}</div>`);
    if ((L.theme || []).length) rows.push(`<div class="rel-row"><span class="tag">同题</span>${L.theme.map((t) => jump(t.name, t.id)).join("<span class='rel-sep'>·</span>")}</div>`);
    box.innerHTML = (rows.length ? rows.join("") : `<div style="opacity:.55">— 还没接上关系</div>`)
      + `<div style="margin-top:5px"><span class="rel-jump" id="lnkAdd">+ 挂到总览</span></div>`;
    box.querySelectorAll(".rel-jump[data-jump]").forEach((j) => j.onclick = () => { CUR = j.dataset.jump; renderDetail(); });
    box.querySelectorAll("[data-unlink]").forEach((x) => x.onclick = async (ev) => {
      ev.stopPropagation();
      const rr = await apiFetch("/drawer/unlink", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ childId: e.id, parentId: x.dataset.unlink }),
      }).catch(() => null);
      toast(rr?.ok ? "拿下来了" : (rr?.err || "没拿下来"));
      await fillRel(e);
    });
    const addBtn = box.querySelector("#lnkAdd");
    if (addBtn) addBtn.onclick = () => linkPicker(e, parents);
  }

  /** 选一个总览挂上去：同一个人、priority≥ 75、没挂过的 */
  function linkPicker(e, parents) {
    const box = document.getElementById("relBox");
    if (!box) return;
    const taken = new Set((parents || []).map((p) => p.parentId));
    const cand = BOOK.filter((x) => x.id !== e.id && !taken.has(x.id) && String(x.agentId || "") === String(e.agentId || "") && (Number(x.priority) || 0) >= 75);
    if (!cand.length) { toast("没有可挂的总览（先有一条 priority ≥ 75 的条目）"); return; }
    box.innerHTML = `<div style="opacity:.7">挂到哪个总览？</div><div style="margin-top:4px">${cand.map((x) => `<span class="rel-jump" data-pick="${esc(x.id)}">${esc(x.name)}</span>`).join("<span class='rel-sep'>·</span>")}</div>`;
    box.querySelectorAll("[data-pick]").forEach((el) => el.onclick = async () => {
      const r = await apiFetch("/drawer/link", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ childId: e.id, parentId: el.dataset.pick }),

  }

    }
    // 总览候选：同一个 agent 的总览层（p>=75）；万一没命中，就拿同 agent 排前面的几条
    let allEntries = [];

      const dr = await apiFetch("/drawer");

    } catch { /* 收成单条也行 */ }
    const parentsByItem = {};
    for (const it of items) {
      const own = allEntries.filter((e) => String(e.agentId || "") === String(it.agentId || ""));

      if (!cand.length) cand = own.slice().sort((a, b) => Number(b.priority) - Number(a.priority)).slice(0, 12);
      parentsByItem[it.id] = cand;
    }
    const priOpts = [75, 50, 25, 100].map((p) => `<option value="${p}"${p === 50 ? " selected" : ""}>${p}</option>`).join("");
    el.innerHTML = items.map((it) => {
      const cand = parentsByItem[it.id] || [];
      const who = NAME[String(it.agentId || "")] || String(it.agentId || "通用");
      const rows = cand.length
        ? cand.map((p) => `<label style="display:flex;gap:6px;align-items:center;margin:4px 0;font-size:11px">
            <input type="checkbox" data-pchk="${esc(it.id)}" value="${esc(p.id)}">
            <span>${esc(p.name)}<span style="opacity:.5">（${p.priority}）</span></span>
          </label>`).join("")
        : `<div style="font-size:11px;opacity:.5">这个 agent 名下还没有总览条目</div>`;
      return `<div class="rulecard" data-sg="${esc(it.id)}">

        </div>
        ${it.why ? `<div style="font-size:11px;opacity:.65;margin-bottom:6px">${esc(it.why)}</div>` : ""}
        <div style="font-size:12px;line-height:1.6;white-space:pre-wrap">${esc(String(it.body || "").slice(0, 400))}${String(it.body || "").length > 400 ? "……" : ""}</div>
        <div style="margin-top:8px;font-size:11px">
          <button class="btn" data-ptoggle="${esc(it.id)}" style="padding:3px 10px">归到总览（可选）</button>
          <div id="pw_${esc(it.id)}" style="display:none;margin-top:6px;border-top:1px dashed rgba(120,105,70,.35);padding-top:6px">
            ${rows}
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:6px;font-size:11px">
          <span style="opacity:.6">优先级</span><select data-pri="${esc(it.id)}" style="font-size:11px">${priOpts}</select>
        </div>
        <div class="rfoot" style="margin-top:8px">
          <button class="btn primary" data-acc="${esc(it.id)}">收下，进抽屉</button>
          <button class="btn" data-rej="${esc(it.id)}">扔掉</button>
        </div>
      </div>
    </div>`;
    }).join("");
    el.querySelectorAll("[data-ptoggle]").forEach((b) => (b.onclick = () => {
      const w = el.querySelector(`#pw_${b.dataset.ptoggle}`);
      if (!w) return;
      const open = w.style.display !== "none";

      const priority = Number((el.querySelector(`[data-pri="${id}"]`) || {}).value) || 50;
      const nameEl = el.querySelector(`[data-name="${id}"]`);
      const name = nameEl ? String(nameEl.value || "").trim() : "";
      const r = await apiFetch("/suggest/accept", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, name, parents: chosen, priority }) });
      toast(r?.ok ? (r.appended ? `补进已有「${r.name}」了` : `收下了「${r.name}」${r.parents?.length ? `（归到 ${r.parents.join("、")}）` : ""}`) : "没收成：" + (r?.err || "?"));

  async function loadTalkPanel() {
    let d = null;
    try { d = await apiFetch("/talk?status=pending"); } catch { d = null; }
    if (d && typeof d.requireConfirm === "boolean") REAL = !d.requireConfirm;

    const cb = $("realMode");
    if (cb) {
      cb.checked = REAL;
      cb.onchange = async () => {
        try {
          const r = await apiFetch("/real-mode", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ on: cb.checked }),
          });
          if (r?.ok) {
            REAL = r.on === true;
            toast(REAL ? "真实模式开了：只读，递话直接送" : "真实模式关了：可改，递话要你点");
            await loadTalkPanel();
            if (SEAL) { SEAL = null; await loadSeal(); }
          } else toast(r?.err || "没改成");
        } catch { toast("请求失败"); }
      };
    }

    // 心跳开关（只一个勾，即改即生效）
    let wakeOn = false;
    try { const w = await apiFetch("/wake"); wakeOn = w?.on === true; } catch { wakeOn = false; }
    const wb = $("wakeOn");
    if (wb) {
      wb.checked = wakeOn;
      wb.onchange = async () => {
        const r = await apiFetch("/wake", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ on: wb.checked }),
        }).catch(() => null);
        toast(r?.ok ? (r.on ? "心跳开了" : "心跳关了") : (r?.err || "没改成"));
      };
    }

    const box = $("talkList");
    if (!box) return;    if (REAL) { box.innerHTML = `<div class="cfg-hint">递话直接送到，不提醒。</div>`; return; }
    const items = (d && d.items) || [];
    if (!items.length) { box.innerHTML = `<div class="cfg-hint">没有待转达</div>`; return; }
    box.innerHTML = items.map((it) => `<div style="display:flex;gap:8px;align-items:center;padding:5px 0;font-size:11px;border-top:1px dashed rgba(120,105,70,.25)">
      <span style="opacity:.65;white-space:nowrap">${esc(NAME[it.from] || it.from)} → ${esc(NAME[it.to] || it.to)}</span>

  // ══════════ ODAY（官方单据） ══════════
  function parseLetter(text) {
    const out = { mood: "", why: "", weather: "", secs: [] };
    if (!text) return out;
    const lines = text.split(/\r?\n/);
    let cur = null;
    for (let raw of lines) {
      const line = raw.trimEnd();
      let m;
      if ((m = line.match(/^#(?!#)\s*(.+)$/))) {
        const t = m[1].trim();
        const parts = t.split(/[·・]/);
        out.date = (parts[0] || "").trim();
        out.mood = parts.slice(1).join("·").trim();
        cur = null; continue;
      }
      if ((m = line.match(/^>\s*今日心绪[：:]\s*(.+)$/))) { out.why = m[1].trim(); cur = null; continue; }
      if ((m = line.match(/^##\s*(.+)$/))) {
        const name = m[1].trim();
        if (name === "天气") { cur = { name, type: "weather", text: [] }; out.secs.push(cur); }
        else { cur = { name, type: "sec", route: "", text: [] }; out.secs.push(cur); }
        continue;
      }
      if (!cur) continue;
      if ((m = line.match(/^\s*-\s*\[位置[：:]\s*([^\]]+)\]\s*$/))) { cur.route = m[1].trim(); continue; }
      const bodyLine = line.replace(/^\s*-\s?/, "");
      if (!bodyLine.trim()) continue;
      cur.text.push(bodyLine.trim());
    }
    // 天气移出 secs
    const w = out.secs.find((s) => s.type === "weather");
    if (w) { out.weather = w.text.join(" "); out.secs = out.secs.filter((s) => s.type !== "weather"); }
    return out;
  }

  // 自绘日历（黄单配色）
  function calHtml(y, m, cur) {
    const today = todayStr();
    const first = new Date(y, m - 1, 1);
    const startDow = (first.getDay() + 6) % 7;   // 周一为首
    const daysIn = new Date(y, m, 0).getDate();
    const prevDays = new Date(y, m - 1, 0).getDate();
    let cells = "";
    const wd = ["一","二","三","四","五","六","日"].map((d) => `<div class="wd">${d}</div>`).join("");
    for (let i = 0; i < startDow; i++) cells += `<div class="dy out">${prevDays - startDow + 1 + i}</div>`;
    for (let d = 1; d <= daysIn; d++) {
      const ds = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const cls = ["dy", ds === cur ? "on" : "", ds === today ? "tod" : "", ds > today ? "dis" : ""].filter(Boolean).join(" ");
      cells += `<div class="${cls}" data-d="${ds}">${d}</div>`;
    }
    const tail = (7 - ((startDow + daysIn) % 7)) % 7;
    for (let i = 1; i <= tail; i++) cells += `<div class="dy out">${i}</div>`;
    return `<div class="od-cal-hd"><span data-mv="-1">‹</span>${y} 年 ${m} 月<span data-mv="1">›</span></div>
      <div class="od-cal-grid">${wd}${cells}</div>
      <div class="od-cal-ft"><span data-act="clr">清除</span><span data-act="tdy">今天</span></div>`;
  }

      // 绑在 document 上只绑一次：mapbox 每次重渲染都是新元素，绑旧的会失效
      document.addEventListener("mousedown", (e) => {
        const b = e.target.closest("#view-loc #mapbox");

    put("rect", { x: 0, y: 66, width: 300, height: 26, fill: "#7d776c" });
    put("rect", { x: 0, y: 0, width: 12, height: 92, fill: "#7d776c", opacity: .5 });
    put("rect", { x: 288, y: 0, width: 12, height: 92, fill: "#7d776c", opacity: .5 });
    put("rect", { x: .8, y: .8, width: 298.4, height: 90.4, rx: 14, fill: "none",
                  stroke: "#4b463d", "stroke-width": 2, opacity: .45 });
    g.appendChild(clip);
  })();

  // ══════════ 壳尺寸：高锁 960，宽跟着窗口走 ══════════
  (function () {
    function fit() {
      const stack = document.querySelector(".stack");
      const shell = document.querySelector(".shell");
      if (!stack || !shell) return;
      const svg  = shell.querySelector("svg.shellart");
      const book = shell.querySelector(".book");
      const wrap = shell.querySelector(".wrap");
      if (!svg || !book) return;

      const W = stack.clientWidth;
      const H = stack.clientHeight;
      if (W < 10 || H < 10) return;

      // 缩放比：高度、宽度里取小的那个，整张壳才不会溢出窗口
      const k = Math.min(H / 960, W / 1606);
      window.__shellK = k;
      const vw = W / k;                     // 当前能看到多宽
      const contentW = 1126 + 480;          // 板 + 抽屉露出来的那截
      const dx = Math.max(0, (vw - contentW) / 2);   // 居中补的位移

      shell.style.width  = W + "px";
      shell.style.height = H + "px";
      svg.setAttribute("viewBox", (-dx).toFixed(2) + " 0 " + vw.toFixed(2) + " 960");
      const ov = document.getElementById("shellover");
      if (ov) ov.setAttribute("viewBox", (-dx).toFixed(2) + " 0 " + vw.toFixed(2) + " 960");
      const fo = document.getElementById("shellfold");
      if (fo) fo.setAttribute("viewBox", (-dx).toFixed(2) + " 0 " + vw.toFixed(2) + " 960");
      const pc = document.getElementById("shellpencil");
      if (pc) pc.setAttribute("viewBox", (-dx).toFixed(2) + " 0 " + vw.toFixed(2) + " 960");

      // 地图：本子 + 抽屉那么大（x 52 → 1606，y 37 → 887）
      const mp = document.getElementById("maplayer");
      if (mp) {
        mp.style.left   = ((52 + dx) * k).toFixed(1) + "px";
        mp.style.top    = (37 * k).toFixed(1) + "px";
        mp.style.width  = (1554 * k).toFixed(1) + "px";
        mp.style.height = (850 * k).toFixed(1) + "px";
      }

      // 纸：单独一层
      // 详情纸：贴在抽屉内衬上（内衬左上 1102,83；纸 left 29 / top 49；420×642）
      const sw = shell.querySelector(".sheetWrap");
      if (sw) {
        sw.style.setProperty("--k", k.toFixed(3));
        sw.style.left   = ((1131 + dx) * k).toFixed(1) + "px";
        sw.style.top    = (132 * k).toFixed(1) + "px";
        sw.style.width  = (420 * k).toFixed(1) + "px";
        sw.style.height = (642 * k).toFixed(1) + "px";
        const sh = sw.querySelector(".sheet");
        if (sh) { sh.style.zoom = k; sh.style.width = "420px"; sh.style.height = "642px"; }
      }

      const pw = shell.querySelector(".paperWrap");
      if (pw) {
        pw.style.left   = ((71 + dx) * k).toFixed(1) + "px";
        pw.style.top    = (59 * k).toFixed(1) + "px";
        pw.style.width  = (979 * k).toFixed(1) + "px";
        pw.style.height = (762 * k).toFixed(1) + "px";
      }

      // 封签的证件卡：贴着抽屉衬板，按同一个比例缩
      const cb = document.getElementById("cardbox");
      if (cb) {
        cb.style.left = ((1153 + dx) * k).toFixed(1) + "px";
        cb.style.top = (96 * k).toFixed(1) + "px";
        cb.style.transform = "scale(" + k.toFixed(4) + ")";
      }
      // 内容：在纸里面，让开左边那排螺旋
      book.style.left   = (51 * k).toFixed(1) + "px";
      book.style.top    = "0px";
      book.style.width  = (928 * k).toFixed(1) + "px";
      book.style.height = (762 * k).toFixed(1) + "px";
      if (wrap) wrap.style.zoom = k;

      // 标签：贴在纸右沿，一半压纸一半伸出去
      shell.querySelectorAll(".tabsnav .tn").forEach((el) => {
        const i = +el.dataset.i || 0;
        el.style.left     = ((1002 + dx) * k).toFixed(1) + "px";
        el.style.top      = ((106 + i * 46) * k).toFixed(1) + "px";
        el.style.width    = (118 * k).toFixed(1) + "px";
        el.style.height   = (34 * k).toFixed(1) + "px";
        el.style.fontSize = (12 * k).toFixed(1) + "px";
      });
    }
    window.addEventListener("resize", fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(document.querySelector(".stack"));
    fit(); setTimeout(fit, 60); setTimeout(fit, 400);
    window.__fitBook = fit;
  })();

  // 启动
  (async () => {
    showView("book");
    try { await apiFetch("/ping"); } catch { $("foot").textContent = "宿主未响应"; }
    // 先拉一遍角色表：AGENTS / NAME 都从 /seal 来，不先拉的话信页和地图第一眼是空的
    await loadRealMode();
    await loadSeal();
    await loadBook();
  })();
</script>
</body>
